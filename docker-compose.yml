version: "3.9"
services:
  host:
    image: pbullian/sec_host_win
    container_name: sec_host
    ports:
      - "2222:22"
    cap_add:
      - NET_ADMIN
      - SYS_ADMIN
    security_opt:
      - apparmor=unconfined
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,mode=1777
    volumes:
      - ./artifacts:/artifacts
  attacker:
    image: debian:12
    container_name: sec_attacker
    command: sleep infinity
    depends_on:
      - host
