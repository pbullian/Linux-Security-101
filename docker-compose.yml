services:
  target:
    build: .
    image: linux-security-target:2026
    hostname: target
    ports:
      - "127.0.0.1:${LAB_SSH_PORT:-2222}:22"
    cap_add:
      - NET_ADMIN
      - SYS_ADMIN
    security_opt:
      - apparmor=unconfined
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,mode=1777
    volumes:
      - ./artifacts:/artifacts
    healthcheck:
      test: ["CMD-SHELL", "/usr/sbin/sshd -t && pgrep -x sshd >/dev/null"]
      interval: 3s
      timeout: 2s
      retries: 15
  client:
    build: ./client
    image: linux-security-client:2026
    hostname: client
    command: sleep infinity
    depends_on:
      target:
        condition: service_healthy
