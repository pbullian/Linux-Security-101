services:
  host:
    build: .
    image: linux-security-host:2026
    ports:
      - "127.0.0.1:${LAB_SSH_PORT:-2222}:22"
    cap_add:
      - NET_ADMIN
      - SYS_ADMIN
    security_opt:
      - apparmor=unconfined
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,mode=1777
    volumes:
      - ./artifacts:/artifacts
    networks:
      default:
        aliases: [sec_host]
    healthcheck:
      test: ["CMD-SHELL", "/usr/sbin/sshd -t && pgrep -x sshd >/dev/null"]
      interval: 3s
      timeout: 2s
      retries: 15
  attacker:
    build: ./attacker
    image: linux-security-attacker:2026
    command: sleep infinity
    depends_on:
      host:
        condition: service_healthy
    networks:
      default:
        aliases: [sec_attacker]
